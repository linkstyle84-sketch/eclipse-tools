<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이클립스 결속 · 도건유튜브</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0a08;
      --ink: #f6edd6;
      --muted: #cbb994;
      --gold: #e4c36a;
      --card: #17130e;
      --line: rgba(228, 195, 106, 0.28);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(900px 380px at 50% -60px, #3a2410 0%, transparent 62%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans KR", sans-serif;
    }
    .wrap {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }
    header { text-align: center; margin-bottom: 18px; }
    .title-art {
      display: block;
      width: min(420px, 100%);
      height: auto;
      margin: 0 auto 10px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 900;
      color: var(--gold);
      letter-spacing: -0.02em;
    }
    .lead {
      margin: 0 auto 22px;
      max-width: 34em;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.55;
    }
    .video {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #100c08;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
    }
    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .actions {
      display: grid;
      gap: 10px;
      margin-top: 22px;
    }
    .cta {
      display: block;
      padding: 16px 18px;
      border-radius: 14px;
      border: 1px solid #f3d56a;
      background: linear-gradient(180deg, #2a2014, #1a140e);
      color: #fff8d6;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.02em;
    }
    .cta:hover { filter: brightness(1.08); }
    .sub {
      display: block;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }
    .sub:hover { color: #fffdf6; border-color: var(--gold); }
    .note {
      margin: 16px 0 0;
      color: #8f866f;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="title-art" src="eclipse-header.png?v=102" alt="이클립스 결속">
      <h1>도건유튜브 · 결속 가이드</h1>
      <p class="lead">영상을 먼저 확인한 뒤, 아래에서 결속 추천 도구를 사용할 수 있습니다.</p>
    </header>

    <div class="video">
      <iframe
        src="https://www.youtube.com/embed/KsAZsT1QYx8"
        title="도건유튜브 이클립스 결속 가이드"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>

    <div class="actions">
      <a class="cta" href="Index.html">결속 도구 사용하기</a>
      <a class="sub" href="https://www.youtube.com/watch?v=KsAZsT1QYx8" target="_blank" rel="noopener">유튜브에서 영상 보기</a>
    </div>
    <p class="note">유튜브 더보기·고정 댓글에는 이 페이지 주소를 넣어 주세요.</p>
  </div>
</body>
</html>
