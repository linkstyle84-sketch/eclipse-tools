<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이클립스 결속 · 도건유튜브</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0a08;
      --ink: #f6edd6;
      --muted: #cbb994;
      --gold: #e4c36a;
      --card: #17130e;
      --line: rgba(228, 195, 106, 0.28);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(900px 380px at 50% -60px, #3a2410 0%, transparent 62%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans KR", sans-serif;
    }
    .wrap {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }
    header { text-align: center; margin-bottom: 18px; }
    .title-art {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 0 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #100c08;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 900;
      color: var(--gold);
      letter-spacing: -0.02em;
    }
    .lead {
      margin: 0 auto 22px;
      max-width: 34em;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.55;
    }
    .video {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #100c08;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
    }
    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .actions {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }
    .cta {
      display: block;
      padding: 20px 22px;
      border-radius: 16px;
      border: 2px solid #ffe08a;
      background: linear-gradient(180deg, #f3d56a 0%, #d4a93a 100%);
      color: #1a1208;
      text-align: center;
      text-decoration: none;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.03em;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, .35),
        0 10px 28px rgba(243, 213, 106, .35),
        0 0 40px rgba(243, 213, 106, .18);
      animation: cta-pulse 1.8s ease-in-out infinite;
    }
    .cta:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }
    .cta small {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      font-weight: 800;
      opacity: .78;
    }
    @keyframes cta-pulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 10px 28px rgba(243,213,106,.35), 0 0 40px rgba(243,213,106,.18); }
      50% { box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 12px 34px rgba(243,213,106,.5), 0 0 56px rgba(243,213,106,.32); }
    }
    .sub {
      display: block;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }
    .sub:hover { color: #fffdf6; border-color: var(--gold); }
    .note {
      margin: 16px 0 0;
      color: #8f866f;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="title-art" src="eclipse-header.png?v=102" alt="이클립스 결속">
      <h1>도건유튜브 · 결속 가이드</h1>
      <p class="lead">영상을 먼저 확인한 뒤, 아래에서 결속 추천 도구를 사용할 수 있습니다.</p>
    </header>

    <div class="video">
      <iframe
        src="https://www.youtube.com/embed/KsAZsT1QYx8"
        title="도건유튜브 이클립스 결속 가이드"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>

    <div class="actions">
      <a class="cta" id="open-tool" href="Index.html">
        결속 도구 사용하기
        <small>클릭 시 유튜브 영상도 함께 열립니다</small>
      </a>
      <a class="sub" href="https://www.youtube.com/watch?v=KsAZsT1QYx8" target="_blank" rel="noopener">유튜브에서 영상만 보기</a>
    </div>
    <p class="note">유튜브 링크는 영문 주소를 사용해 주세요.<br>https://linkstyle84-sketch.github.io/eclipse-tools/bind/</p>
  </div>
  <script>
    (function () {
      if (location.hostname.endsWith("github.io") && location.pathname.indexOf("/bind/") === -1) {
        location.replace("/eclipse-tools/bind/");
        return;
      }
      var btn = document.getElementById("open-tool");
      if (!btn) return;
      var yt = "https://www.youtube.com/watch?v=KsAZsT1QYx8";
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        var tool = btn.getAttribute("href");
        window.open(yt, "_blank", "noopener");
        location.href = tool;
      });
    })();
  </script>
</body>
</html>
